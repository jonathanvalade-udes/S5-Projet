# ==========================================
# CONFIGURATION FSM - PICAR-S (OPTUNA)
# ==========================================
# Frequence de la boucle FSM (Hz). 50 Hz : frequence sur laquelle LINE_KP / LINE_KD ont ete regles (100 Hz fait echouer l'evitement en simulation).
HZ=50.0
MAX_ACCELERATION=0.735
STRAIGHT_CRUISE_SPEED=0.3200
# Puissance moteur (%) quand la vitesse atteint STRAIGHT_CRUISE_SPEED : c'est elle qui fixe la vitesse maximale reelle.
# 50 = environ 0.32 m/s (valeur validee). Plus haut = plus vite en droite ET en virage (bornes 20 a 75). N'affecte pas l'evitement.
MAX_POWER_PCT=50
MIN_CURVE_SPEED=0.2000
CURVE_SAFETY_FACTOR=0.8000 #etait a 0.9000 (change par Abdoul)

LINE_KP=0.5800
LINE_KD=0.0350

OBSTACLE_STOP_DIST_CM=20.0
REVERSE_SPEED=0.12
AVOID_SIDE=1.0
# ---- Evitement d'obstacle : 12 etapes (le robot s'arrete a OBSTACLE_STOP_DIST_CM, puis) ----
# Chaque cle est bornee par le FSM (bornes entre parentheses). Distance parcourue = vitesse x duree (0.16 m/s -> 16 cm par seconde).
# 1      reculer                                                        AVOID_REVERSE_DIST_M (m, 0.10 a 0.50)
# 2-3    roues braquees de X deg vers le cote choisi (AVOID_SIDE), avancer X s     AVOID_ANGLE_1_DEG (15 a 45), AVOID_TIME_1_S (0.3 a 3.0)
# 4-5    roues droites, avancer X s (diagonale)                         AVOID_DIAG_TIME_S (0.3 a 3.0), AVOID_DIAG_SPEED (0.12 a 0.25 m/s)
# 6-7    roues braquees de X deg de l'AUTRE cote, avancer X s           AVOID_ANGLE_2_DEG (15 a 45), AVOID_TIME_2_S (0.2 a 2.0)
# 8      roues droites, avancer plus (le robot est parallele a la ligne) AVOID_PARALLEL_TIME_S (0.2 a 4.0)
# 9-10   roues braquees de X deg vers la ligne, avancer X s             AVOID_ANGLE_3_DEG (15 a 45), AVOID_TIME_3_S (0.2 a 2.0)
# 11-12  roues droites, avancer jusqu'a trouver la ligne (duree maximale) AVOID_RETURN_TIME_S (1.0 a 5.0), AVOID_RETURN_SPEED (0.12 a 0.25)
# Avec 45 deg, un virage de 1.10 s (etape 3) ou 0.70 s (etapes 7 et 10) change le cap d'environ 45 deg : plus de duree = plus de rotation.
AVOID_REVERSE_DIST_M=0.25
AVOID_ANGLE_1_DEG=45
AVOID_TIME_1_S=1.10
AVOID_DIAG_TIME_S=1.10
AVOID_DIAG_SPEED=0.16
AVOID_ANGLE_2_DEG=45
AVOID_TIME_2_S=0.70
AVOID_PARALLEL_TIME_S=1.00
AVOID_ANGLE_3_DEG=45
AVOID_TIME_3_S=0.70
AVOID_RETURN_TIME_S=3.5
AVOID_RETURN_SPEED=0.16
