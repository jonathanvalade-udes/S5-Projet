# ==========================================
# CONFIGURATION FSM - PICAR-S (OPTUNA)
# ==========================================
# Frequence de la boucle FSM (Hz). 50 Hz : frequence sur laquelle LINE_KP / LINE_KD ont ete regles (100 Hz fait echouer l'evitement en simulation).
HZ=50.0
MAX_ACCELERATION=0.735
STRAIGHT_CRUISE_SPEED=0.3200
MIN_CURVE_SPEED=0.2000
CURVE_SAFETY_FACTOR=0.8000 #etait a 0.9000 (change par Abdoul)

LINE_KP=0.5800
LINE_KD=0.0350

OBSTACLE_STOP_DIST_CM=20.0
REVERSE_SPEED=0.12
AVOID_SIDE=1.0
# Evitement d'obstacle, phase 2 (diagonale pour s'ecarter) : distance parcourue = vitesse x duree (0.16 x 1.10 = ~18 cm).
# Pour avancer plus longtemps : augmenter AVOID_DIAG_TIME_S (bornes 0.3 a 3.0 s) ; vitesse bornee a 0.12 - 0.25 m/s.
AVOID_DIAG_TIME_S=1.10
AVOID_DIAG_SPEED=0.16
AUTO_START_DELAY=0.0
