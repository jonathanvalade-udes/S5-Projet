# ==========================================
# CONFIGURATION FSM - PICAR-S (OPTUNA)
# ==========================================
# Frequence de la boucle FSM (Hz). 50 Hz : frequence sur laquelle LINE_KP / LINE_KD ont ete regles (100 Hz fait echouer l'evitement en simulation).
HZ=50.0
MAX_ACCELERATION=0.735
STRAIGHT_CRUISE_SPEED=0.3200
# Puissance moteur (%) quand la vitesse atteint STRAIGHT_CRUISE_SPEED : c'est elle qui fixe la vitesse maximale reelle.
# 50 = environ 0.32 m/s (valeur validee). Plus haut = plus vite en droite ET en virage (bornes 20 a 75). N'affecte pas l'evitement.
MAX_POWER_PCT=50
MIN_CURVE_SPEED=0.2000
CURVE_SAFETY_FACTOR=0.8000 #etait a 0.9000 (change par Abdoul)

LINE_KP=0.5800
LINE_KD=0.0350

OBSTACLE_STOP_DIST_CM=20.0
REVERSE_SPEED=0.12
AVOID_SIDE=1.0
# Evitement d'obstacle, phase 2 (diagonale pour s'ecarter) : distance parcourue = vitesse x duree (0.16 x 1.10 = ~18 cm).
# Pour avancer plus longtemps : augmenter AVOID_DIAG_TIME_S (bornes 0.3 a 3.0 s) ; vitesse bornee a 0.12 - 0.25 m/s.
AVOID_DIAG_TIME_S=1.10
AVOID_DIAG_SPEED=0.16
# Evitement d'obstacle, phase 5 (deuxieme diagonale, retour vers la piste) : elle s'arrete des que le ruban est vu.
# AVOID_RETURN_TIME_S = duree MAXIMALE de la recherche (bornes 1.0 a 5.0 s), AVOID_RETURN_SPEED = vitesse (0.12 - 0.25 m/s).
AVOID_RETURN_TIME_S=3.5
AVOID_RETURN_SPEED=0.16
# Evitement d'obstacle, virages (phases 2, 3 et 4) : les roues restent braquees a AVOID_TURN_ANGLE_DEG (15 a 45, 45 = a fond)
# pendant AVOID_TURN_OUT_TIME_S (1er virage, 0.3 a 3.0 s) puis AVOID_TURN_TIME_S (virages suivants, 0.2 a 2.0 s).
# Avec 45 deg et 1.10 / 0.70 s, chaque virage tourne le cap d'environ 45 deg : plus de duree = plus de rotation.
AVOID_TURN_ANGLE_DEG=45
AVOID_TURN_OUT_TIME_S=1.10
AVOID_TURN_TIME_S=0.70
