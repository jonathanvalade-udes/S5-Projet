# ==============================================================================
# Docker Compose pour le projet PiCar (Build, Tests et Simulation Godot)
# ==============================================================================
# Usage :
#   docker compose -f services/docker-compose.yml up builder     # Compiler
#   docker compose -f services/docker-compose.yml up simulation  # Lancer SimBridge + FSM pour Godot
# ==============================================================================
services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    image: alpine-picar-builder:latest
    container_name: picar-builder
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -c "cmake -B build-embedded -S . -DSTATIC=ON && cmake --build build-embedded --parallel"

  simulation:
    build:
      context: .
      dockerfile: Dockerfile.builder
    image: alpine-picar-builder:latest
    container_name: picar-sim
    volumes:
      - .:/workspace
    working_dir: /workspace
    ports:
      - "9000:9000"
    command: sh -c "chmod +x run_sim.sh && ./run_sim.sh"
