# ==========================================
# CONFIGURATION FASTDRINK - PICAR-S
# ==========================================
# Modifiable en live par WiFi ou via 'nano /root/picar.conf'
# Zéro recompilation nécessaire !

# 1. Cinématique & Protection Bille (pour éviter que la bille ne tombe)
MAX_ACCELERATION=0.735
STRAIGHT_CRUISE_SPEED=0.40        # Augmenté 0.32 -> 0.40 m/s : rampe MotionProfiler garantit a <= 0.735 m/s²
MIN_CURVE_SPEED=0.14
# Facteur de sécurité physique centrifuge Ackermann (0.50 = très prudent, 0.85 = agressif validé, 1.00 = limite théorique critique)
CURVE_SAFETY_FACTOR=0.85          # Augmenté 0.75 -> 0.85 : validé R >= 150 mm sans chute bille
# Gain feedforward prédictif sur d_error/dt (0.0 = désactivé, 0.06 = défaut, 0.12 = très anticipatif)
PREDICTIVE_BRAKE_GAIN=0.06        # Freine avant d'entrer dans le virage, compense latence ~60 ms moteurs

# 2. Asservissement Suivi de Ligne (PID)
LINE_KP=0.65
LINE_KD=0.05

# 3. Évitement & Sécurité
OBSTACLE_STOP_DIST_CM=20.0
REVERSE_SPEED=0.12

