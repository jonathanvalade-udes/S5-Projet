# 1. Cinématique & Protection Bille (pour éviter que la bille ne tombe)
MAX_ACCELERATION=0.735
STRAIGHT_CRUISE_SPEED=0.32
MIN_CURVE_SPEED=0.14
# Facteur de sécurité physique centrifuge Ackermann (0.50 = très prudent, 0.75 = équilibré, 1.00 = limite théorique critique)
CURVE_SAFETY_FACTOR=0.75

# 2. Asservissement Suivi de Ligne (PD)
LINE_KP=0.65
LINE_KD=0.05

# 3. Évitement & Sécurité
OBSTACLE_STOP_DIST_CM=20.0
REVERSE_SPEED=0.12

